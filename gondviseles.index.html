<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gondviselés Gyógyszertár - Orgovány</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; color: #333; padding-top: 60px; }

        /* --- NAVIGÁCIÓ --- */
        nav {
            background-color: #1a1a1a;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            height: 60px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo { font-size: 1.1rem; font-weight: bold; color: white; text-decoration: none; }
        .nav-links { display: flex; list-style: none; }
        .nav-links li { margin-left: 20px; }
        .nav-links a { color: white; text-decoration: none; font-size: 0.95rem; }
        .hamburger { display: none; cursor: pointer; font-size: 1.5rem; color: white; }

        /* --- FEJLÉC (HERO) --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
            /* Biztonsági sötétzöld háttér + a Te képed */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://i.ibb.co/G4VhqZVY/20250731-141420.jpg') no-repeat center center/cover;
            background-color: #1b4d3e; 
        }

        .hero h1 { font-size: 3rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        /* --- SZEKCIÓK --- */
        section { padding: 60px 5%; max-width: 1100px; margin: 0 auto; text-align: center; }
        .section-title { font-size: 2rem; margin-bottom: 25px; }

        /* --- TÉRKÉP JAVÍTÁSA --- */
        #terkep { background-color: #f4f4f4; }
        .map-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 arány mobilhoz is */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .map-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* --- FACEBOOK --- */
        .facebook-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background-color: #1877F2;
            color: white;
            font-size: 30px;
            border-radius: 12px;
            text-decoration: none;
            margin-top: 20px;
        }

        /* --- MOBIL --- */
        @media screen and (max-width: 768px) {
            .hamburger { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 0;
                background-color: #1a1a1a;
                width: 100%;
                padding: 20px 0;
            }
            .nav-links.active { display: flex; }
            .nav-links li { margin: 15px 0; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">Gondviselés Gyógyszertár</a>
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links" id="menuList">
            <li><a href="#szolgaltatasok" onclick="toggleMenu()">Szolgáltatások</a></li>
            <li><a href="#rolunk" onclick="toggleMenu()">Rólunk</a></li>
            <li><a href="#terkep" onclick="toggleMenu()">Térkép</a></li>
            <li><a href="#kapcsolat" onclick="toggleMenu()">Kapcsolat</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Gondviselés Gyógyszertár</h1>
        <p>Orgovány, Kossuth Lajos u. 65.</p>
    </header>

    <section id="szolgaltatasok">
        <h2 class="section-title">Szolgáltatások</h2>
        <p>Hamarosan...</p>
    </section>

    <section id="rolunk">
        <h2 class="section-title">Rólunk</h2>
        <p>Patikánk szeretettel várja Önt.</p>
    </section>

    <section id="terkep">
        <h2 class="section-title">Itt találsz minket</h2>
        <div class="map-wrapper">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2743.83248383216!2d19.4583!3d46.7111!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4743e332c7eb1717%3A0x225c909c04ee2582!2zR29uZHZpc2Vsw6lzIEd5w7ZneXN6ZXJ0w6Fy!5e0!3m2!1shu!2shu!4v1700000000000!5m2!1shu!2shu" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>
    </section>

    <section id="kapcsolat">
        <h2 class="section-title">Kapcsolat</h2>
        <a href="https://www.facebook.com/gondviselesgyogyszertar/" target="_blank" class="facebook-link">
            <i class="fab fa-facebook-f"></i>
        </a>
    </section>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menuList');
            if (window.innerWidth <= 768) {
                menu.classList.toggle('active');
            }
        }
    </script>

</body>
</html>
